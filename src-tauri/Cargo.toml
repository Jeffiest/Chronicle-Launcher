[package]
name = "chronicle-launcher"
description = "Chronicle Launcher: set up and play the Dark Cloud ports, with MoonMod"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "chronicle_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chronicle-launcher-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
