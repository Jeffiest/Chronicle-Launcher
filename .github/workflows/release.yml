# Builds the launcher's installers. Nothing from the games is in them: players bring their own disc and their own
# build of the ports (README, "Where it stands").
#
# - A tag v1.2.3 makes a draft GitHub release with the installers, once the tag matches the version in
#   package.json, src-tauri/tauri.conf.json and Cargo.toml (node scripts/version.mjs set 1.2.3 bumps all three).
#   Publish the draft by hand after a look.
# - Run by hand (Actions > release > Run workflow), it builds the same installers as artifacts, with no release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          # The oldest supported Ubuntu, so the AppImage and .deb run on older glibc too.
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-14
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/version.mjs check "${{ github.ref_name }}"
      - name: Tauri's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run verify
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Chronicle Launcher ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            The launcher for The Moon People's Dark Cloud (Chronicle) and Dark Chronicle (Chronicle Two) ports,
            with MoonMod. It holds nothing from the games: bring your own PAL disc and your build of the port
            (Get the game on each game's page).

            - Windows: the `-setup.exe` (or the `.msi`). Windows may warn that the installer is not signed.
            - Linux: the `.AppImage` (make it executable and run it) or the `.deb`.
            - macOS (Apple silicon): the `.dmg`. It is not signed: open it with right-click > Open the first time.
      - name: Keep the installers (run by hand)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-launcher-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
